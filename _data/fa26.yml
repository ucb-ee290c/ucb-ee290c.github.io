# ---------------------------------------------------------------------------
# Fall 2026 bring-up course content.
#
# Everything the CS285-style course layout renders comes from this file.
# Edit here; you should not need to touch _layouts/course.html.
#
# Anything still marked "TBD" is a placeholder to fill in before the site
# goes live.
# ---------------------------------------------------------------------------

course:
  number: "EE 194 / 290C"
  title: "Tapeout Chip Bring-Up"
  term: "Fall 2026"
  short: "EE 194/290C"
  tagline: "Test integrated circuit chips designed in previous tapeout classes"
  # Rendered as raw HTML, so the venue can carry its own link.
  lectures: '<a href="https://maps.app.goo.gl/w3SZwYDuYRUozRV38">Berkeley Wireless Research Center</a>, Friday 14:00-17:00'

# Notices under the hero, rendered as plain paragraphs. Free-form HTML, so
# lead with a bold label the way the reference site does. Delete the list
# items to hide the block.
announcements:
  - text: >-
      <b>Announcement</b>: This site is the Fall 2026 offering. Content is still being finalized.

# ---------------------------------------------------------------------------
# Staff cards. Roster taken from Lecture 1, slides 2 and 3.
#
# `image` is a path under /assets/images/staff/ and is optional; a lettered
# placeholder is drawn when it is missing. `url` and `bio` are optional too.
#
# The lecture slides carry no instructor emails or homepage links, so those
# are left TBD rather than guessed.
#
# Office hours are not listed. To bring them back, add `hours: "..."` to any
# person -- the layout already renders that field when it is present.
# ---------------------------------------------------------------------------
